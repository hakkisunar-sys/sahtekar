<title>Sahtekar Kim?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column over a split blue (crew) / red (imposter) night backdrop; sticky action bar at the bottom. */
:root{
  --bg:#0b1122; --crew-bg:#0f1b38; --imp-bg:#2a0f1c;
  --panel:#151f3a; --panel2:#1c2848; --line:#2a3860;
  --fg:#eef1fa; --muted:#94a1c2; --faint:#5d6a8c;
  --crew:#4d8dff; --crew-ink:#0b1a3d; --imp:#ff4b5f; --imp-ink:#3a0710; --gold:#f5b942; --ok:#3ccf8e;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;color:var(--fg);
  background:var(--bg) linear-gradient(90deg,var(--crew-bg) 0 50%,var(--imp-bg) 50% 100%) fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 60% at 50% 0%,transparent 40%,rgba(5,8,18,.75) 100%)}
.wrap{max-width:520px;margin:0 auto;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input::placeholder,textarea::placeholder{color:var(--faint)}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}

/* brand */
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:16px}
.brand h1{font-size:clamp(34px,11vw,52px);font-weight:900;line-height:1}
.brand h1 .r{color:var(--imp)} .brand h1 .b{color:var(--crew)}
.mask{width:84px;height:84px}

.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px)}
.panel h2{font-size:17px}
.row{display:flex;gap:10px;align-items:center}
.row>input{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 18px;font-weight:600;background:var(--panel2);border:1.5px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--crew);border-color:var(--crew);color:#fff;font-family:var(--display);font-weight:700;font-size:17px;padding:16px}
.btn.danger{background:var(--imp);border-color:var(--imp);color:#fff;font-family:var(--display);font-weight:700}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1d00;font-weight:700}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#code{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);text-align:center}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip b{color:var(--fg);font-family:var(--display);letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--faint)}
.banner{background:var(--imp-ink);border:1px solid var(--imp);color:#ffd5da;border-radius:12px;padding:10px 14px;font-size:14px}

/* lobby */
.codebig{font-family:var(--display);font-size:clamp(36px,12vw,54px);letter-spacing:.18em;font-weight:900;text-align:center;line-height:1.1}
.share{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.qr{width:116px;height:116px;background:#fff;border-radius:10px;padding:6px;display:grid;place-items:center}
.qr img,.qr svg{width:100%;height:100%;display:block}
.linkbox{font-size:13px;word-break:break-all;color:var(--muted);min-width:0}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:500}
.pl.offline{opacity:.5}
.pl .sc{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:13px}
.pl .crown{color:var(--gold);font-size:12px}
.pl .x{color:var(--muted);padding:0 2px;font-size:16px;line-height:1}
.pl.me{border-color:var(--crew)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{background:var(--bg);border:1.5px solid var(--crew);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.step .q{font-size:14px;color:var(--muted)}
.step .ctl{display:flex;align-items:center;gap:14px}
.step .ctl button{width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:20px;line-height:1}
.step .val{font-family:var(--display);font-size:28px;font-weight:700;min-width:1.4em;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--crew)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{position:relative;border-radius:16px;padding:12px;background:var(--bg);border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tile .ic{font-size:26px;line-height:1}
.tile .nm{font-weight:600;font-size:15px}
.tile .ct{font-size:12px;color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--imp);background:color-mix(in srgb,var(--imp) 12%,var(--bg))}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--imp);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.tile.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.tile .edit{position:absolute;bottom:8px;right:10px;font-size:12px;color:var(--muted);text-decoration:underline}
.sumlist{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 60%,transparent)}
.bar .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

/* role card */
.card{perspective:1200px;height:300px}
.card .flip{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.on .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;border:1.5px solid var(--line)}
.front{background:repeating-linear-gradient(135deg,var(--panel) 0 14px,var(--panel2) 14px 28px)}
.front .tap{font-family:var(--display);font-size:20px}
.back{transform:rotateY(180deg)}
.back.crew{background:linear-gradient(160deg,#1b3a85,#0f1d48);border-color:var(--crew)}
.back.imp{background:linear-gradient(160deg,#8a1326,#3a0710);border-color:var(--imp)}
.back.spec{background:var(--panel)}
.word{font-family:var(--display);font-weight:900;font-size:clamp(26px,9vw,42px);line-height:1.1;word-break:break-word}
.impword{font-family:var(--display);font-weight:900;font-size:clamp(30px,10vw,46px);color:#fff;letter-spacing:.04em}
.starter{display:flex;align-items:center;gap:14px;background:var(--gold);color:#2b1d00;border-radius:var(--r);padding:14px 16px}
.starter .big{font-family:var(--display);font-weight:700;font-size:20px;word-break:break-word}
.order{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;counter-reset:o}
.order li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--panel2)}
.order li::before{counter-increment:o;content:counter(o);font-family:var(--display);font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);flex:none}
.order li.first::before{background:var(--gold);color:#2b1d00}
.timer{font-family:var(--display);font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.timer.low{color:var(--imp)}

/* vote */
.vlist{display:flex;flex-direction:column;gap:8px}
.vbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:16px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-weight:600;font-size:17px;text-align:left}
.vbtn[aria-pressed="true"]{border-color:var(--imp);background:color-mix(in srgb,var(--imp) 18%,var(--panel2))}
.vbtn[disabled]{opacity:.4}
.vbtn .ck{font-size:13px;color:var(--ok);font-weight:500}
.progress{height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.progress i{display:block;height:100%;background:var(--crew);transition:width .3s}
.locked{text-align:center;padding:20px;border-radius:var(--r);background:var(--imp-ink);border:1.5px solid var(--imp)}
.locked .who{font-family:var(--display);font-size:24px;margin-top:6px;word-break:break-word}

/* result */
.verdict{text-align:center;padding:26px 18px;border-radius:24px;display:flex;flex-direction:column;gap:8px;align-items:center}
.verdict.crew{background:linear-gradient(160deg,#1b3a85,#0f1d48);border:1.5px solid var(--crew)}
.verdict.imp{background:linear-gradient(160deg,#8a1326,#3a0710);border:1.5px solid var(--imp)}
.verdict.wait{background:linear-gradient(160deg,#5b4410,#2b1d00);border:1.5px solid var(--gold)}
.verdict h2{font-size:clamp(22px,7vw,30px)}
.reveal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reveal>div{background:var(--panel2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.reveal .v{font-family:var(--display);font-size:18px;word-break:break-word}
.tally{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.tr .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tr .n .imp{color:var(--imp);font-size:12px;font-weight:700;margin-left:6px;letter-spacing:.08em}
.tr .c{font-variant-numeric:tabular-nums;font-family:var(--display)}
.tr .b{grid-column:1/-1;height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.tr .b i{display:block;height:100%;background:var(--muted)}
.tr.acc .b i{background:var(--imp)}
.tr .by{grid-column:1/-1;font-size:12px;color:var(--muted)}

details.rules{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
details.rules summary{cursor:pointer;font-weight:600}
details.rules ol{padding-left:20px;margin:10px 0 0;display:flex;flex-direction:column;gap:6px;color:var(--muted)}

#modal{position:fixed;inset:0;z-index:20;background:rgba(4,7,16,.8);display:grid;place-items:center;padding:16px}
#modal .panel{width:100%;max-width:480px;max-height:90vh;overflow:auto}
textarea{min-height:180px;resize:vertical}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--imp);animation:sp 1s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="modal" hidden></div>
<div id="toast" hidden></div>

const b64=u=>btoa(String.fromCharCode(...u));

async function ensureKeys(){
  if(me.keys) return;
  const kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveKey"]);
  const j=await crypto.subtle.exportKey("jwk",kp.publicKey);
  me.keys={kp,pub:j.x+"."+j.y};
}
const keyCache=new Map();
async function shared(pub){
  if(keyCache.has(pub)) return keyCache.get(pub);
  const [x,y]=pub.split(".");
  const pk=await crypto.subtle.importKey("jwk",{kty:"EC",crv:"P-256",x,y,ext:true},{name:"ECDH",namedCurve:"P-256"},false,[]);
  const k=await crypto.subtle.deriveKey({name:"ECDH",public:pk},me.keys.kp.privateKey,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  keyCache.set(pub,k);return k;
}
async function seal(pub,obj){
  const k=await shared(pub),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out);
}
async function unseal(pub,s){
  const k=await shared(pub),u=unb64(s);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},k,u.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

  return {send(st){r.presence({t:"h",st}).catch(e=>{console.warn(e);if(e&&e.code==="invalid_argument")toast("Oyuncu sayısı bu mod için fazla.")})},leave(){r.leave().catch(()=>{})}};
}
async function roomClientNet(room,code){
  const r=await room.join("sk-"+code.toLowerCase());
  let last=null;
  r.onPeers(ch=>{
    const h=ch.peers.find(p=>p.presence&&p.presence.t==="h"&&p.presence.st&&p.presence.st.code===code);
    if(h){U.hostGone=false;if(h.presence.st!==last){last=h.presence.st;onState(last)}}
    else if(U.S&&!U.hostGone){U.hostGone=true;render()}
  },e=>console.warn(e));
  return {send(p){r.presence(p).catch(()=>{})},leave(){r.leave().catch(()=>{})}};
}
function safeSend(c,d){try{if(c.open)c.send(d)}catch(e){}}
function peerHostNet(code,onReady,onFail){
  const peer=new Peer(PEER_PREFIX+code,{debug:0});
  const conns=new Map();let last=null,ready=false;
  const list=()=>hostOnClients([...conns.values()].filter(e=>e.pres).map(e=>e.pres));
  peer.on("open",()=>{ready=true;onReady()});
  peer.on("connection",conn=>{
    conns.set(conn.connectionId,{conn,pres:null});
    conn.on("open",()=>{if(last)safeSend(conn,{t:"s",st:last})});
    conn.on("data",d=>{if(d&&d.t==="c"){const e=conns.get(conn.connectionId);if(e){e.pres=d;list()}}});
    const drop=()=>{if(conns.delete(conn.connectionId))list()};
    conn.on("close",drop);conn.on("error",drop);
  });
  peer.on("disconnected",()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}});
  peer.on("error",e=>{if(!ready)onFail(e.type)});
  return {send(st){last=st;for(const {conn} of conns.values())safeSend(conn,{t:"s",st})},leave(){try{peer.destroy()}catch(e){}}};
}
function peerClientNet(code){
  let peer,conn,closed=false,lastPres=null,got=false,rt=null;
  const connect=()=>{
    if(closed) return;
    conn=peer.connect(PEER_PREFIX+code,{reliable:true});
    conn.on("open",()=>{U.conn=true;if(lastPres)safeSend(conn,lastPres);render()});
    conn.on("data",d=>{if(d&&d.t==="s"){got=true;U.conn=true;onState(d.st)}});
    conn.on("close",()=>{if(closed)return;U.conn=false;render();retry()});
  };
  const retry=()=>{if(closed||rt)return;rt=setTimeout(()=>{rt=null;try{if(peer.disconnected)peer.reconnect()}catch(e){}connect()},2000)};
  peer=new Peer({debug:0});
  peer.on("open",connect);
  peer.on("disconnected",()=>{if(!closed)try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){if(!got)fail("Bu kodla açık bir oyun bulunamadı. Kodu kontrol et.");else{U.conn=false;render();retry()}}
    else if(!got&&["network","server-error","socket-error","browser-incompatible","ssl-unavailable"].includes(e.type))fail("Bağlantı kurulamadı ("+e.type+"). İnternet bağlantını kontrol et.");
  });
  return {send(p){lastPres=p;if(conn)safeSend(conn,p)},leave(){closed=true;try{peer.destroy()}catch(e){}}};
}

/* ---------- presence of this phone ---------- */
function initPres(){myPres={t:"c",pid:me.pid,name:me.name,pub:me.keys.pub,rid:null,vote:null,lock:false}}
function pushPres(patch){
  Object.assign(myPres,patch);
  if(U.isHost) hostRecompute(); else if(net) net.send({...myPres});
}

/* ---------- host (game authority) ---------- */
const customCats=()=>LS.get("custom",[]).map(c=>({id:c.id,name:c.name,icon:"✏️",words:c.words,custom:true}));
const allCats=()=>[...CATS,...customCats()];
const selectedCats=()=>allCats().filter(c=>H.settings.cats.includes(c.id)&&c.words.length);

function hostInit(code,resume){
  if(resume){H=resume;H.game&&(H.game.sec={},H.game.secPub={})}
  else H={code,pid:me.pid,players:[{pid:me.pid,name:me.name}],
    settings:LS.get("settings",{imp:1,tOn:false,tMin:2,showCat:false,cats:["hayvan","meyve","yemek","nesne"]}),
    phase:"lobby",game:null,scores:{},used:[],n:0};
  H.online=new Set([me.pid]);H.pres=new Map();H.remote=[];
}
function saveHost(){const {online,pres,remote,...rest}=H;LS.set("host",{...rest,at:Date.now()})}
function hostOnClients(list){if(!H)return;H.remote=list;hostRecompute()}
function hostRecompute(){
  const m=new Map();
  for(const p of [...H.remote,{...myPres}]) if(p&&typeof p.pid==="string"&&p.pid.length<=16) m.set(p.pid,p);
  H.pres=m;H.online=new Set(m.keys());
  for(const [pid,p] of m){
    const nm=String(p.name||"").replace(/\s+/g," ").trim().slice(0,18)||"Oyuncu";
    const pl=H.players.find(x=>x.pid===pid);
    if(!pl){if(H.players.length<24)H.players.push({pid,name:nm})}else pl.name=nm;
  }
  if(H.phase==="vote"){
    const g=H.game;
    for(const pid of g.ord){const p=m.get(pid);
      if(p&&p.rid===g.rid&&p.lock&&p.vote&&!g.votes[pid]&&g.ord.includes(p.vote)&&p.vote!==pid) g.votes[pid]=p.vote;}
    if(g.ord.every(pid=>g.votes[pid])){finishVote();return}
  }
  hostBroadcast();
}
let bcBusy=false,bcAgain=false;
async function hostBroadcast(){
  if(bcBusy){bcAgain=true;return}bcBusy=true;
  try{do{bcAgain=false;await ensureSec();const st=buildState();saveHost();if(net)net.send(st);onState(st)}while(bcAgain)}
  catch(e){console.error(e)}finally{bcBusy=false}
}
function rolePayload(pid){const g=H.game;return g.imps.includes(pid)?{i:1,c:H.settings.showCat?g.cat:null,k:g.imps.length}:{w:g.word,c:g.cat}}
async function ensureSec(){
  const g=H.game;if(!g||!(H.phase==="play"||H.phase==="vote"))return;
  for(const pid of g.ord){const pub=H.pres.get(pid)?.pub;
    if(typeof pub==="string"&&pub.length<200&&g.secPub[pid]!==pub){try{g.sec[pid]=await seal(pub,rolePayload(pid));g.secPub[pid]=pub}catch(e){console.warn(e)}}}
}
function buildState(){
  const g=H.game;
  return {v:1,code:H.code,hp:H.pid,hk:me.keys.pub,ph:H.phase,
    pl:H.players.map(p=>[p.pid,p.name,H.online.has(p.pid)?1:0]),
    set:{imp:H.settings.imp,tOn:H.settings.tOn?1:0,tMin:H.settings.tMin,cat:H.settings.showCat?1:0,cn:selectedCats().map(c=>c.name)},
    g:g?{rid:g.rid,n:g.n,ord:g.ord,st:g.st,end:g.end,voted:Object.keys(g.votes),sec:H.phase==="play"||H.phase==="vote"?g.sec:{},ic:g.imps.length,res:g.res}:null,
    sc:H.scores,now:Date.now()};
}
async function hostStart(){
  const parts=H.players.filter(p=>H.online.has(p.pid)).map(p=>p.pid);
  if(parts.length<3) return toast("En az 3 oyuncu gerekli.");
  const cats=selectedCats();if(!cats.length) return toast("En az bir kategori seç.");
  const pool=[];cats.forEach(c=>c.words.forEach(w=>pool.push([w,c.name])));
  let fresh=pool.filter(([w])=>!H.used.includes(w));if(!fresh.length){H.used=[];fresh=pool}
  const [word,cat]=pick(fresh);H.used.push(word);if(H.used.length>600)H.used=H.used.slice(-600);
  const ic=Math.min(H.settings.imp,Math.max(1,Math.floor((parts.length-1)/2)));
  const imps=shuffle(parts).slice(0,ic);
  const crew=parts.filter(p=>!imps.includes(p));
  const st=pick(crew),i=parts.indexOf(st);
  H.n++;
  H.game={rid:newId(),n:H.n,ord:[...parts.slice(i),...parts.slice(0,i)],st,end:H.settings.tOn?Date.now()+H.settings.tMin*60000:0,votes:{},word,cat,imps,sec:{},secPub:{},res:null};
  H.phase="play";await hostBroadcast();
}
function hostToVote(){H.phase="vote";hostRecompute()}
function finishVote(){
  const g=H.game,N=g.imps.length,cnt={};
  g.ord.forEach(p=>cnt[p]=0);Object.values(g.votes).forEach(t=>{if(t in cnt)cnt[t]++});
  const sorted=[...g.ord].sort((a,b)=>cnt[b]-cnt[a]);
  const cutoff=sorted[N]!==undefined?cnt[sorted[N]]:0;
  const acc=sorted.filter(p=>cnt[p]>cutoff&&cnt[p]>0).slice(0,N);
  const caught=acc.length===N&&g.imps.every(p=>acc.includes(p));
  g.res={word:g.word,cat:g.cat,imps:g.imps,votes:{...g.votes},acc,stage:caught?"guess":"final",win:caught?null:"imp",guessed:null};
  if(!caught) applyScores(g.res);
  H.phase="result";hostBroadcast();
}
function applyScores(res){
  const g=H.game,add=(p,n)=>H.scores[p]=(H.scores[p]||0)+n;
  if(res.win==="crew") g.ord.filter(p=>!g.imps.includes(p)).forEach(p=>add(p,1));
  else g.imps.forEach(p=>add(p,res.guessed?1:2));
}
function hostGuess(ok){const r=H.game.res;if(!r||r.stage!=="guess")return;r.guessed=ok;r.win=ok?"imp":"crew";r.stage="final";applyScores(r);hostBroadcast()}
function hostLobby(){H.phase="lobby";H.game=null;hostBroadcast()}
function setSetting(k,v){H.settings[k]=v;LS.set("settings",H.settings);hostBroadcast()}

/* ---------- every phone ---------- */
function onState(st){
  if(!st||st.v!==1) return;
  clearTimeout(failTimer);
  U.S=st;U.clockOff=st.now-Date.now();U.screen="game";U.hostGone=false;
  const g=st.g;
  if(g&&g.rid!==U.curRid){U.curRid=g.rid;U.revealed=false;U.voteSel=null;U.role=null;U.roleSig="";if(myPres.rid!==g.rid)pushPres({rid:g.rid,vote:null,lock:false})}
  if(!g){U.curRid=null;U.role=null}
  const sec=g&&g.sec&&g.sec[me.pid];
  if(sec&&st.hk){const sig=st.hk+sec;if(sig!==U.roleSig){U.roleSig=sig;
    unseal(st.hk,sec).then(r=>{if(U.roleSig===sig){U.role=r;render()}}).catch(e=>console.warn(e))}}
  if(st.ph==="play"||st.ph==="vote")wakeLock();
  render();
}
const names=()=>Object.fromEntries((U.S?.pl||[]).map(p=>[p[0],p[1]]));

async function startHost(resume){
  if(!saveName()) return;
  U.isHost=true;U.screen="connecting";render();
  await ensureKeys();initPres();
  const room=await detectRoom();
  hostInit(resume?resume.code:genCode(),resume);
  if(room){
    U.mode="room";
    try{net=await roomHostNet(room,H.code)}catch(e){return fail("Oda açılamadı ("+(e&&e.code||e)+").")}
    hostRecompute();
  }else{
    if(typeof Peer==="undefined") return fail("Bağlantı kütüphanesi yüklenemedi. İnternetini kontrol edip sayfayı yenile.");
    U.mode="peer";let tries=0;
    const go=()=>{net=peerHostNet(H.code,()=>hostRecompute(),why=>{
      try{net.leave()}catch(e){}
      if(why==="unavailable-id"&&tries++<8){if(!resume)H.code=genCode();setTimeout(go,resume?2500:0)}
      else fail(location.protocol.startsWith("http")||location.protocol==="file:"?"Bağlantı sunucusuna ulaşılamadı ("+why+"). İnternetini kontrol et.":"Bu ortamda telefonlar arası bağlantı kurulamıyor.")})};
    go();
  }
}

function roleFace(st){
  const g=st.g;
  if(!g.ord.includes(me.pid)) return `<div class="face back spec"><span class="label">İzleyici</span><p>Bu tur başladıktan sonra katıldın. Sonraki turda sen de oynarsın.</p></div>`;
  const r=U.role;
  if(!r) return `<div class="face back spec"><div class="spin"></div><p class="muted">Rolün hazırlanıyor…</p></div>`;
  if(r.i) return `<div class="face back imp"><span class="label" style="color:#ffc2c9">Rolün</span><div class="impword">SAHTEKAR</div><p style="margin:0">Kelimeyi bilmiyorsun. Diğerlerini dinle ve çaktırma.</p>${r.c?`<span class="tag" style="color:#fff">Kategori: ${esc(r.c)}</span>`:""}${r.k>1?`<span class="small" style="color:#ffc2c9">Bu turda ${r.k} sahtekar var.</span>`:""}</div>`;
  return `<div class="face back crew"><span class="label" style="color:#bcd2ff">Gizli kelime</span><div class="word">${esc(r.w)}</div><span class="tag" style="color:#fff">${esc(r.c)}</span><p class="small" style="margin:0;color:#bcd2ff">Kelimeyi söyleme, çağrıştır.</p></div>`;
}
function playView(st){
  const g=st.g,N=names();
  let h=`<section class="card ${U.revealed?"on":""}"><div class="flip" data-act="flip" role="button" tabindex="0" aria-label="Rol kartını çevir">
    <div class="face front">${MASK}<span class="tap">Rolünü görmek için dokun</span><span class="muted small">Ekranı kimseye gösterme</span></div>${roleFace(st)}</div></section>
  <div class="starter"><span style="font-size:30px" aria-hidden="true">🎤</span><div><div class="small" style="font-weight:600">İlk söyleyen</div><div class="big">${esc(N[g.st]||"?")}</div></div></div>`;
  if(g.end) h+=`<div class="panel"><span class="label" style="text-align:center">Kalan süre</span><div class="timer" id="timer">--:--</div></div>`;
  h+=`<section class="panel"><h2>Söyleme sırası · Tur ${g.n}</h2><p class="muted small" style="margin:0">Herkes sırayla bir kelime ya da kısa cümle söylesin. 1–2 tur dönün.</p><ol class="order">${g.ord.map(p=>`<li class="${p===g.st?"first":""}">${esc(N[p]||"?")}${p===me.pid?' <span class="muted small">(sen)</span>':""}</li>`).join("")}</ol></section>`;
  if(U.isHost) h+=`<div class="bar"><div class="in"><button class="btn danger wide" data-act="tovote">Tur tamamlandı · Oylamaya geç</button><button class="btn ghost small" data-act="lobby">Turu iptal et, lobiye dön</button></div></div>`;
  return h;
}
function voteView(st){
  const g=st.g,N=names(),voted=new Set(g.voted),total=g.ord.length;
  const part=g.ord.includes(me.pid),locked=myPres.lock&&myPres.rid===g.rid;
  let h=`<section class="panel" style="text-align:center"><h2 style="font-size:24px">Sahtekar kim?</h2><p class="muted small" style="margin:0">Oyunu seç ve kilitle. Kilitledikten sonra değiştiremezsin.</p></section>`;
  if(!part) h+=`<p class="muted" style="text-align:center">Bu turu izliyorsun.</p>`;
  else if(locked) h+=`<div class="locked"><span class="label" style="color:#ffc2c9">Oyun kilitlendi</span><div class="who">${esc(N[myPres.vote]||"?")}</div></div>`;
  else h+=`<div class="vlist">${g.ord.map(p=>`<button class="vbtn" data-act="sel" data-pid="${esc(p)}" aria-pressed="${U.voteSel===p}" ${p===me.pid?"disabled":""}><span>${esc(N[p]||"?")}${p===me.pid?" (sen)":""}</span>${voted.has(p)?'<span class="ck">✓ oy verdi</span>':""}</button>`).join("")}</div>`;
  h+=`<section class="panel"><div class="row" style="justify-content:space-between"><span class="label">Verilen oy</span><b style="font-variant-numeric:tabular-nums">${voted.size} / ${total}</b></div><div class="progress"><i style="width:${total?voted.size/total*100:0}%"></i></div>
   <div class="sumlist">${g.ord.filter(p=>!voted.has(p)).map(p=>`<span class="tag">${esc(N[p]||"?")} bekleniyor</span>`).join("")}</div></section>`;
  const btns=[];
  if(part&&!locked) btns.push(`<button class="btn danger wide" data-act="lock" ${U.voteSel?"":"disabled"}>${U.voteSel?"Oyumu kilitle · "+esc(N[U.voteSel]||""):"Birini seç"}</button>`);
  if(U.isHost) btns.push(`<button class="btn ${part&&!locked?"ghost":""} wide" data-act="endvote" ${voted.size?"":"disabled"}>Oylamayı şimdi bitir</button>`);
  if(btns.length) h+=`<div class="bar"><div class="in">${btns.join("")}</div></div>`;
  return h;
}
function resultView(st){
  const g=st.g,r=g.res,N=names();if(!r) return "";
  const impN=r.imps.map(p=>N[p]||"?").join(", "),amImp=r.imps.includes(me.pid);
  let cls,title,sub;
  if(r.stage==="guess"){cls="wait";title=r.imps.length>1?"Sahtekarlar yakalandı!":"Sahtekar yakalandı!";sub=`${esc(impN)} şimdi kelimeyi sesli tahmin etsin. Doğru bilirse yine kazanır.`}
  else if(r.win==="crew"){cls="crew";title="Masumlar kazandı";sub=`${esc(impN)} yakalandı ve kelimeyi bilemedi.`}
  else if(r.guessed){cls="imp";title="Sahtekar kazandı";sub=`${esc(impN)} yakalandı ama kelimeyi doğru tahmin etti.`}
  else{cls="imp";title="Sahtekar kazandı";sub=r.acc.length?`Yanlış kişiyi seçtiniz. Sahtekar: ${esc(impN)}`:`Oylar eşit çıktı, kimse elenmedi. Sahtekar: ${esc(impN)}`}
  const cnt={};g.ord.forEach(p=>cnt[p]=0);Object.values(r.votes).forEach(t=>{if(t in cnt)cnt[t]++});
  const max=Math.max(1,...Object.values(cnt));
  let h=`<section class="verdict ${cls}"><span class="label" style="color:#fff">${amImp?"Sen sahtekardın":"Tur "+g.n+" sonucu"}</span><h2>${title}</h2><p style="margin:0">${sub}</p></section>
  <div class="reveal"><div><span class="label">Kelime</span><span class="v">${esc(r.word)}</span><span class="small muted">${esc(r.cat)}</span></div><div><span class="label">Sahtekar</span><span class="v" style="color:var(--imp)">${esc(impN)}</span></div></div>
  <section class="panel"><h2>Oylar</h2><div class="tally">${[...g.ord].sort((a,b)=>cnt[b]-cnt[a]).map(p=>{
    const by=Object.entries(r.votes).filter(([,t])=>t===p).map(([v])=>N[v]||"?");
    return `<div class="tr ${r.acc.includes(p)?"acc":""}"><span class="n">${esc(N[p]||"?")}${r.imps.includes(p)?'<span class="imp">SAHTEKAR</span>':""}</span><span class="c">${cnt[p]}</span><span class="b"><i style="width:${cnt[p]/max*100}%"></i></span>${by.length?`<span class="by">${by.map(esc).join(", ")}</span>`:""}</div>`}).join("")}</div></section>
  <section class="panel"><h2>Puanlar</h2>${playersBlock(st)}<p class="muted small" style="margin:0">Yakalanırsa masumlara +1. Kaçarsa sahtekara +2, yakalanıp kelimeyi bilirse +1.</p></section>`;
  if(U.isHost){
    h+=r.stage==="guess"
      ?`<div class="bar"><div class="in"><span class="small muted" style="text-align:center">Sahtekarın tahmini doğru mu? Kelime: <b>${esc(r.word)}</b></span><div class="row"><button class="btn gold wide" data-act="guess" data-ok="1">Bildi</button><button class="btn primary wide" data-act="guess" data-ok="0">Bilemedi</button></div></div></div>`
      :`<div class="bar"><div class="in"><button class="btn primary wide" data-act="start">Yeni tur</button><button class="btn ghost small" data-act="lobby">Lobiye dön, ayarları değiştir</button></div></div>`;
  }else if(r.stage==="guess") h+=`<p class="muted" style="text-align:center">Kurucu tahmini onaylayacak.</p>`;
  return h;
}
function tick(){
  const el=document.getElementById("timer");if(!el||!U.S||!U.S.g)return;
  const left=Math.max(0,U.S.g.end-(Date.now()+(U.clockOff||0)));
  const s=Math.ceil(left/1000);el.textContent=left<=0?"Süre doldu!":`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  el.classList.toggle("low",s<=15);
}
setInterval(tick,500);
function drawQR(){
  const el=document.getElementById("qr");if(!el||typeof qrcode==="undefined")return;
  try{const q=qrcode(0,"M");q.addData(joinLink());q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){el.hidden=true}
}

/* ---------- custom category editor ---------- */
function openCatEditor(id){
  const list=LS.get("custom",[]),c=list.find(x=>x.id===id)||{id:"",name:"",words:[]};
  const m=document.getElementById("modal");
  m.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${c.id?"Kategoriyi düzenle":"Yeni kategori"}</h2>
   <label class="label" for="cname">Kategori adı</label><input id="cname" maxlength="24" value="${esc(c.name)}" placeholder="Örn. Bizim Mahalle">
   <label class="label" for="cwords">Kelimeler (virgülle ya da alt alta)</label><textarea id="cwords" placeholder="Bakkal Ahmet, Sahil, Tekne…">${esc(c.words.join("\n"))}</textarea>
   <div class="row"><button class="btn primary wide" data-act="savecat" data-id="${esc(c.id)}">Kaydet</button><button class="btn" data-act="closecat">Vazgeç</button></div>
   ${c.id?`<button class="btn ghost small" data-act="delcat" data-id="${esc(c.id)}">Bu kategoriyi sil</button>`:""}</div>`;
  m.hidden=false;document.getElementById("cname").focus();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t||t.disabled)return;
  const a=t.dataset.act;
  if(a!=="endask") U.confirmEnd=false;
  switch(a){
    case "host": startHost(null);break;
    case "resume": {const r=LS.get("host",null);if(r)startHost(r);break}
    case "join": joinGame(document.getElementById("code").value);break;
    case "home": U.screen="home";render();break;
    case "leave": leave();break;
    case "endask": if(U.confirmEnd)leave();else{U.confirmEnd=true;render()}break;
    case "copy": {const l=joinLink();navigator.clipboard?.writeText(l).then(()=>toast("Bağlantı kopyalandı."),()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("lnk"));getSelection().removeAllRanges();getSelection().addRange(r);toast("Seçili bağlantıyı kopyala.")});break}
    case "kick": H.players=H.players.filter(p=>p.pid!==t.dataset.pid||H.online.has(p.pid));hostBroadcast();break;
    case "imp": setSetting("imp",Math.min(5,Math.max(1,H.settings.imp+ +t.dataset.d)));break;
    case "tmin": setSetting("tMin",Math.min(10,Math.max(1,H.settings.tMin+ +t.dataset.d)));if(!H.settings.tOn)setSetting("tOn",true);break;
    case "tog": setSetting(t.dataset.k,!H.settings[t.dataset.k]);break;
    case "cat": {if(e.target.closest("[data-act=editcat]"))break;const id=t.dataset.id,c=H.settings.cats;setSetting("cats",c.includes(id)?c.filter(x=>x!==id):[...c,id]);break}
    case "editcat": e.stopPropagation();openCatEditor(t.dataset.id);break;
    case "allcats": setSetting("cats",allCats().map(c=>c.id));break;
    case "nocats": setSetting("cats",[]);break;
    case "newcat": openCatEditor(null);break;
    case "closecat": document.getElementById("modal").hidden=true;break;
    case "savecat": {
      const name=document.getElementById("cname").value.trim().slice(0,24);
      const words=[...new Set(document.getElementById("cwords").value.split(/[,\n]/).map(s=>s.trim().slice(0,40)).filter(Boolean))];
      if(!name) return toast("Kategoriye bir ad ver.");if(words.length<3) return toast("En az 3 kelime yaz.");
      const list=LS.get("custom",[]);let id=t.dataset.id;
      if(id){const c=list.find(x=>x.id===id);if(c){c.name=name;c.words=words}}else{id="c_"+newId();list.push({id,name,words})}
      LS.set("custom",list);document.getElementById("modal").hidden=true;
      if(!H.settings.cats.includes(id))H.settings.cats.push(id);setSetting("cats",H.settings.cats);toast("Kategori kaydedildi.");break}
    case "delcat": {const id=t.dataset.id;LS.set("custom",LS.get("custom",[]).filter(x=>x.id!==id));document.getElementById("modal").hidden=true;setSetting("cats",H.settings.cats.filter(x=>x!==id));break}
    case "start": hostStart();break;
    case "flip": U.revealed=!U.revealed;document.querySelector(".card")?.classList.toggle("on",U.revealed);if(U.revealed&&navigator.vibrate)try{navigator.vibrate(30)}catch(_){}return;
    case "tovote": hostToVote();break;
    case "lobby": hostLobby();break;
    case "sel": U.voteSel=t.dataset.pid;render();break;
    case "lock": if(U.voteSel&&U.S.g){pushPres({rid:U.S.g.rid,vote:U.voteSel,lock:true});render()}break;
    case "endvote": finishVote();break;
    case "guess": hostGuess(t.dataset.ok==="1");break;
  }
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".flip")){e.preventDefault();e.target.click()}
  if(e.key==="Enter"&&e.target.id==="code"){joinGame(e.target.value)}
  if(e.key==="Escape"){document.getElementById("modal").hidden=true}
});
window.addEventListener("hashchange",()=>{if(U.screen==="home")render()});
render();
</script>
</body></html>
